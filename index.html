<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fruit Slice — เกมฟันผลไม้</title>
<link rel="stylesheet" href="css/style.css">

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#22c55e">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fruit Slice">
</head>
<body>
<div id="game-wrap">
  <header id="hud">
    <div id="score">คะแนน: <span id="score-value">0</span></div>
    <div id="lives">
      <span class="life">🍉</span><span class="life">🍉</span><span class="life">🍉</span>
    </div>
  </header>

  <canvas id="game-canvas"></canvas>

  <div id="start-screen" class="overlay">
    <h1>Fruit Slice</h1>
    <p>ลากนิ้ว / เมาส์ ฟันผลไม้ให้ขาด อย่าโดนระเบิด!</p>
    <button id="start-btn">เริ่มเกม</button>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h1>จบเกม</h1>
    <p>คะแนนของคุณ: <span id="final-score">0</span></p>
    <button id="restart-btn">เล่นอีกครั้ง</button>
  </div>
</div>

<script src="js/sfx.js"></script>
<script src="js/game.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>
</body>
</html>
